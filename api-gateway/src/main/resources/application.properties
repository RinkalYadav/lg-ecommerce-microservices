spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webmvc.routes[0].id=eureka-test
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8761
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/eureka-test/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=RewritePath=/eureka-test/(?<segment>.*), /${segment}

# ========================================
# ACTUATOR CONFIGURATION
# ========================================

management.endpoints.web.exposure.include=health,info

# Enable Liveness and Readiness Probes
management.endpoint.health.probes.enabled=true

# Liveness Health Group
management.endpoint.health.group.liveness.include=livenessState

# Readiness Health Group
management.endpoint.health.group.readiness.include=readinessState

# Health Indicator Details
management.endpoint.health.show-details=never

# Eureka Health Check
eureka.client.healthcheck.enabled=true

# Application Information
management.info.env.enabled=true
info.app.name=API Gateway
info.app.description=Centralized API Gateway
info.app.version=1.0.0