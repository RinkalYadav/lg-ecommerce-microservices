spring.application.name=config-server

server.port=8888

spring.cloud.config.server.git.uri=https://github.com/RinkalYadav/lg-ecommerce-config-repository.git

# Actuator Configuration
management.endpoints.web.exposure.include=health,info

# Enable Liveness and Readiness Probes
management.endpoint.health.probes.enabled=true

# Liveness Health Group
management.endpoint.health.group.liveness.include=livenessState

# Readiness Health Group
management.endpoint.health.group.readiness.include=readinessState

# Health Indicator Details
management.endpoint.health.show-details=never

# Application Information
management.info.env.enabled=true
info.app.name=Config Server
info.app.description=Centralized Configuration Server
info.app.version=1.0.0